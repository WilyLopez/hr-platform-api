# Blueprint de Render: define el servicio web (construido desde el Dockerfile
# de este mismo repositorio) y la base de datos PostgreSQL gratuita.
# Ver hr-platform-web/docs/DESPLIEGUE_RENDER_VERCEL.md para la guia paso a paso.

databases:
  - name: nexushr-db
    plan: free
    databaseName: nexushr
    user: nexushr

services:
  - type: web
    name: hr-platform-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    # El Dockerfile solo arranca Gunicorn (las migraciones se manejan aparte
    # en docker-compose y en el initContainer de Kubernetes). preDeployCommand
    # no esta disponible en el plan free de Render, asi que se sobrescribe el
    # comando de arranque para correr start.sh (collectstatic + migrate +
    # Gunicorn). Se usa un script en vez de un string largo con "&&" porque
    # Render no lo pasa tal cual a un shell y termina intentando ejecutar
    # el string completo como si fuera el nombre de un solo programa.
    dockerCommand: sh start.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexushr-db
          property: connectionString
      - key: ALLOWED_HOSTS
        # Render revisa la salud del contenedor pegandole por su IP privada
        # interna, no por el dominio publico, asi que restringir ALLOWED_HOSTS
        # a un solo dominio bloquea ese chequeo con 400 (DisallowedHost) y el
        # servicio nunca queda "Live". Detras del proxy de Render (que ya
        # valida que el trafico externo llegue enrutado a este servicio) usar
        # "*" es un tradeoff aceptado y comun en este tipo de despliegues.
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
